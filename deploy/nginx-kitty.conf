# Equivalente Nginx di src/static/.htaccess  (www.kitty.it)
# Adattare: certificati, percorso root, socket PHP-FPM (qui php8.3-fpm; con la 8.5 cambia il nome del socket).

server {                                   # http -> https + www
    listen 80;
    server_name kitty.it www.kitty.it;
    return 301 https://www.kitty.it$request_uri;
}

server {                                   # https senza www -> con www
    listen 443 ssl http2;
    server_name kitty.it;
    ssl_certificate     /etc/letsencrypt/live/kitty.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitty.it/privkey.pem;
    return 301 https://www.kitty.it$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.kitty.it;
    ssl_certificate     /etc/letsencrypt/live/kitty.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitty.it/privkey.pem;

    root /var/www/kitty/dist;               # contenuto della cartella dist/
    index index.html;
    autoindex off;

    # compressione
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/json;
    gzip_vary on;

    # sicurezza di base
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # vecchia versione inglese (WPML): /?lang=en -> /en/
    location = / {
        if ($arg_lang = "en") { return 301 /en/; }
        try_files /index.html =404;
    }

    # vecchi tag del portfolio WordPress -> collezione corrispondente
    location ~ ^/portfolio-tag/lady/?$         { return 301 /lady/; }
    location ~ ^/portfolio-tag/baby/?$         { return 301 /baby/; }
    location ~ ^/portfolio-tag/bangles/?$      { return 301 /baby-bangles/; }
    location ~ ^/portfolio-tag/fantasy(-eng)?/?$ { return 301 /fantasy/; }
    location ~ ^/portfolio-tag/full-(gold|classic)/?$ { return 301 /full-gold/; }
    location ~ ^/portfolio-tag/lightness/?$    { return 301 /lightness/; }
    location ~ ^/portfolio-tag/rosari/?$       { return 301 /rosari/; }
    location ^~ /portfolio-tag/                { return 301 /collezioni/; }

    # pagine = cartelle con index.html
    location / {
        try_files $uri $uri/index.html =404;
    }

    # cache lunga per gli asset (CSS in linea; JS con ?v=hash)
    location ~* \.(webp|jpe?g|png|woff2|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(html|xml|txt)$ { add_header Cache-Control "no-cache"; }

    # modulo contatti (PHP)
    location = /contatti/invia.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        client_max_body_size 64k;
    }
    location ~ \.php$ { return 404; }       # nessun altro PHP esposto

    error_page 404 /404.html;
    location ^~ /en/ { error_page 404 /en/404.html; try_files $uri $uri/index.html =404; }
    location = /404.html    { internal; }
    location = /en/404.html { internal; }
}
